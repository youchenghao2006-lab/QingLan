name: Windows build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Run isolated reading and campus tests
        shell: pwsh
        run: ./scripts/Test.ps1
      - name: Publish Windows x64 application
        shell: pwsh
        run: ./scripts/Publish.ps1
      - name: Verify distribution notices
        shell: pwsh
        run: |
          foreach ($file in @('QingLan.exe', 'LICENSE', 'THIRD_PARTY_NOTICES.md', 'README.md', 'licenses/nuget-packages.json')) {
            if (-not (Test-Path -LiteralPath (Join-Path 'artifacts/publish' $file))) { throw "Missing distribution file: $file" }
          }
          $notices = Get-ChildItem -LiteralPath 'artifacts/publish/licenses' -Recurse -File
          if (-not ($notices | Where-Object Name -eq 'license.txt')) { throw 'No dependency license text bundled.' }
